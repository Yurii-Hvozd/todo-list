{% extends "base.html" %}

{% block title %}{{ object|yesno:"Update,Create" }} tag — Todo{% endblock %}

{% block content %}
  <div class="form-page">
    <div class="page-header">
      <div>
        <span class="eyebrow">Tags</span>
        <h1>{{ object|yesno:"Update,Create" }} tag</h1>
      </div>
    </div>

    <section class="card form-card">
      <form action="" method="post" novalidate>
        {% csrf_token %}
        {{ form.as_p }}
        <div class="form-actions">
          <input type="submit" value="Save tag" class="btn btn-primary">
        </div>
      </form>
    </section>
  </div>
{% endblock %}
