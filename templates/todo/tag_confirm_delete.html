{% extends "base.html" %}

{% block title %}Delete tag — Todo{% endblock %}

{% block content %}
  <section class="card confirm-card">
    <span class="eyebrow danger-eyebrow">Confirmation</span>
    <h1>Delete tag <span>“{{ tag.name }}”</span>?</h1>
    <p>This action cannot be undone.</p>
    <form action="" method="post" class="confirm-actions">
      {% csrf_token %}
      <a href="{% url 'todo_list:tag_list' %}" class="btn btn-secondary">Cancel</a>
      <input type="submit" value="Yes, delete" class="btn btn-danger">
    </form>
  </section>
{% endblock %}
